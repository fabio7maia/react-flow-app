name: Storybook v3
on:
    # Manual for now: publishes to https://fabio7maia.github.io/react-flow-app/v3/ next to the v2 Storybook.
    workflow_dispatch:
permissions:
    contents: write
env:
    HUSKY: 0
jobs:
    deploy:
        name: Build and deploy to GitHub Pages (/v3)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn storybook:build
            - name: Deploy (keeps the v2 Storybook at the root)
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./storybook-static
                  destination_dir: v3
                  keep_files: true
