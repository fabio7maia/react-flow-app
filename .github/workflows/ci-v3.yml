name: CI v3
on:
    pull_request:
        branches:
            - v3
    push:
        branches:
            - v3
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-v3-${{ github.ref }}
    cancel-in-progress: true
env:
    # Git hooks are for local development; in CI they would block the release push.
    HUSKY: 0
jobs:
    checks:
        name: Lint, types, tests, flows, package
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # The flows check compares the graph snapshot with the base branch's (git show).
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Lint and spelling
              run: yarn lint
            - name: Formatting
              run: yarn format:check
            - name: Types and type tests
              run: yarn typecheck
            - name: Tests (engine, event contract, v2 parity, adapters, analytics, testing, CLI, React)
              run: yarn test:coverage
            - name: Intellisense
              run: yarn completions
            - name: Flows (validation, snapshot and diff against the base)
              run: yarn check:flows --base origin/${{ github.base_ref || 'v3' }} --report flows-report.md
            - name: Flows summary
              if: always()
              run: if [ -f flows-report.md ]; then cat flows-report.md >> "$GITHUB_STEP_SUMMARY"; fi
            - name: Build
              run: yarn build
            - name: Package smoke test (types, ESM, CJS, CLI)
              run: yarn smoke
            - name: Storybook
              run: yarn storybook:build --quiet
            - name: Docs site
              run: yarn --cwd website install --frozen-lockfile && yarn docs:build
            - name: Docs links and spelling
              run: yarn check:docs
    compat:
        name: Compatibility (Node ${{ matrix.node }}, React ${{ matrix.react }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - node: '18'
                      react: '18.3.1'
                    - node: '20'
                      react: '19.1.0'
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile --ignore-engines
            - name: React ${{ matrix.react }}
              run: yarn add --dev --ignore-engines react@${{ matrix.react }} react-dom@${{ matrix.react }}
            - name: Tests
              run: yarn test
            - name: Build and package smoke test
              run: yarn build && yarn smoke
    e2e:
        name: E2E (${{ matrix.browser }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Browser cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('yarn.lock') }}
            - name: Browser
              # The download and the apt step sometimes hang for tens of minutes on the runners (the tests take
              # ~15 s): give each attempt a time limit and retry.
              run: |
                  for attempt in 1 2 3; do
                    timeout 240 npx playwright-core install --with-deps ${{ matrix.browser }} && exit 0
                    echo "Attempt $attempt failed, retrying"
                  done
                  exit 1
            - name: E2E
              run: yarn e2e
              env:
                  E2E_BROWSERS: ${{ matrix.browser }}
